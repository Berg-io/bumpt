name: CI

# Community repository: every push and pull request is tested and built.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (includes type check)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Migrations apply on an empty SQLite database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./ci.db
